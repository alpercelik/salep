name: Generator verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generator-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Generator verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            tests: ./scripts/test.sh --max-parallel-test-modules 1
            dogfood: ./build-salep.sh
            typescript: ./scripts/verify-typescript.sh
            publish_typescript: ./scripts/publish-typescript.sh linux-x64
            standalone_typescript: ./artifacts/typescript/linux-x64/salep-typescript validate --config src/samples/TypeScript/Node/salep.typescript.json
            pack: ./scripts/pack-release.sh
          - os: windows-latest
            shell: powershell
            tests: ./scripts/test.ps1 --max-parallel-test-modules 1
            dogfood: ./build-salep.ps1
            typescript: ./scripts/verify-typescript.ps1
            publish_typescript: ./scripts/publish-typescript.ps1 win-x64
            standalone_typescript: ./artifacts/typescript/win-x64/salep-typescript.exe validate --config src/samples/TypeScript/Node/salep.typescript.json
            pack: ./scripts/pack-release.ps1
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check paired script inventory
        run: npm run scripts:check
      - name: Core tests and generator contract matrices
        run: ${{ matrix.tests }}
      - name: Pack and execute the generator against samples and GraphQL server
        run: ${{ matrix.dogfood }}
      - name: Generate and test TypeScript Node consumer
        run: ${{ matrix.typescript }}
      - name: Publish self-contained TypeScript executable
        run: ${{ matrix.publish_typescript }}
      - name: Execute standalone TypeScript validation
        run: ${{ matrix.standalone_typescript }}
      - name: Pack isolated verification version
        run: ${{ matrix.pack }} 0.0.0-generator.${{ github.run_id }}.${{ github.run_attempt }}
      - name: Compare packed consumers and verify incremental generation
        run: node scripts/verify-release-consumers.mjs 0.0.0-generator.${{ github.run_id }}.${{ github.run_attempt }}
